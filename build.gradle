plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def configuredBuildDir = providers.environmentVariable('CODEX_GRADLE_BUILD_DIR')
if (configuredBuildDir.present) {
    layout.buildDirectory = file(configuredBuildDir.get())
}
else {
    def normalizedProjectPath = projectDir.absolutePath.replace('\\', '/').toLowerCase(Locale.ROOT)
    if (normalizedProjectPath.contains('/onedrive/')) {
        def localAppData = System.getenv('LOCALAPPDATA') ?: new File(System.getProperty('user.home'), 'AppData/Local').absolutePath
        def safeProjectName = rootProject.name.toLowerCase(Locale.ROOT).replaceAll('[^a-z0-9._-]+', '-')
        layout.buildDirectory = file("${localAppData}/Codex/gradle-builds/${safeProjectName}")
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.saps.dev/releases' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    gameTestServer {
    }

    data {
        arguments.addAll '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:1.21.1-12.4.2-194"
    compileOnly "malte0811:DualCodecs:0.1.2"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:19.27.0.340"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:19.27.0.340"
    compileOnly "curse.maven:farmers-delight-398521:7596366"
    compileOnly "curse.maven:architectury-api-419699:5786327"
    compileOnly "curse.maven:lets-do-farm-charm-1038103:7959521"
    localRuntime "blusunrize.immersiveengineering:ImmersiveEngineering:1.21.1-12.4.2-194"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            farmersdelight_version_range: farmersdelight_version_range,
            immersiveengineering_version_range: immersiveengineering_version_range,
            optional_compat_version_range: optional_compat_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.register('scanAssets') {
    group = 'verification'
    description = 'Scans resource JSON files for unresolved missing-texture/model placeholders.'
    doLast {
        def resourceRoot = file('src/main/resources')
        def generatedRoot = file('src/generated/resources')
        def hits = []
        [resourceRoot, generatedRoot].findAll { it.exists() }.each { root ->
            fileTree(root).each { resource ->
                if (resource.name.toLowerCase(Locale.ROOT).contains('sprinker')) {
                    hits << "${resource}: misspelled sprinkler resource name"
                }
            }
            fileTree(root).matching { include '**/*.json' }.each { json ->
                def text = json.getText('UTF-8')
                if (text.contains('missingno') || text.contains('missing_texture') || text.contains('minecraft:missing')) {
                    hits << json
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException("Potential missing texture/model references found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanNeoForgeObjModelLoaders') {
    group = 'verification'
    description = 'Scans model JSON files for legacy Forge OBJ loader ids.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []

        roots.each { root ->
            fileTree(root).matching { include 'assets/**/*.json' }.each { json ->
                def text = json.getText('UTF-8')
                if (text.contains('"loader": "forge:obj"')) {
                    hits << json
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Legacy Forge OBJ model loaders found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanImmersiveCookingClientResources') {
    group = 'verification'
    description = 'Checks imported Immersive Cooking fluid blockstates and client model registrations.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []
        def slurper = new groovy.json.JsonSlurper()

        def contentFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/ICContent.java')
        if (contentFile.exists()) {
            def fluidNames = [] as Set
            (contentFile.getText('UTF-8') =~ /FluidEntry\.make\("([^"]+)"/).each { match ->
                fluidNames << match[1]
            }

            fluidNames.sort().each { name ->
                def blockstatePath = "assets/immersivecooking/blockstates/${name}_fluid_block.json"
                def blockstateFile = roots.collect { root -> file("${root}/${blockstatePath}") }.find { it.exists() }
                if (blockstateFile == null) {
                    hits << "Missing fluid blockstate: ${blockstatePath}"
                }
                else {
                    def blockstate = slurper.parse(blockstateFile)
                    def variants = blockstate.variants
                    if (!(variants instanceof Map)) {
                        hits << "${blockstateFile}: missing variants object"
                    }
                    else {
                        (0..15).each { level ->
                            def key = "level=${level}"
                            def variant = variants[key]
                            if (!(variant instanceof Map)) {
                                hits << "${blockstateFile}: missing variant ${key}"
                            }
                            else if (!(variant.model instanceof String)) {
                                hits << "${blockstateFile}: variant ${key} has no model"
                            }
                            else {
                                def parts = variant.model.split(':', 2)
                                def namespace = parts.length == 2 ? parts[0] : 'minecraft'
                                def path = parts.length == 2 ? parts[1] : parts[0]
                                def modelPath = "assets/${namespace}/models/${path}.json"
                                if (!roots.any { root -> file("${root}/${modelPath}").exists() }) {
                                    hits << "${blockstateFile}: variant ${key} references missing model ${modelPath}"
                                }
                            }
                        }
                    }
                }
            }
        }

        def clientSetupFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/client/ClientSetup.java')
        if (clientSetupFile.exists()) {
            def text = clientSetupFile.getText('UTF-8')
            (text =~ /ModelResourceLocation\.standalone\(Resource\.mod\("block\/multiblock\/[^"]+\.obj"\)\)/).each { match ->
                hits << "${clientSetupFile}: raw OBJ registered as standalone baked model: ${match[0]}"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Immersive Cooking client resource issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanFarmingFluidClientTextures') {
    group = 'verification'
    description = 'Checks farming custom fluid types expose non-null client fluid sprite locations.'
    doLast {
        def fluidFile = file('src/main/java/dev/emmanueltremblay/immersivefarming/fluid/IFFluids.java')
        def hits = []

        if (!fluidFile.exists()) {
            hits << "Missing farming fluid registration file: ${fluidFile}"
        }
        else {
            def text = fluidFile.getText('UTF-8')
            [
                    'IClientFluidTypeExtensions',
                    'initializeClient',
                    'getStillTexture()',
                    'getFlowingTexture()',
                    'block/water_still',
                    'block/water_flow'
            ].each { required ->
                if (!text.contains(required)) {
                    hits << "${fluidFile}: missing client fluid texture marker ${required}"
                }
            }

            (text =~ /FLUID_TYPES\.register\(\s*"[^"]+"\s*,\s*\(\)\s*->\s*new\s+FluidType\s*\(/).each { match ->
                hits << "${fluidFile}: direct FluidType registration leaves client sprites nullable: ${match[0]}"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Farming fluid client texture issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanMultiblockTemplateResources') {
    group = 'verification'
    description = 'Checks IE multiblock templates use the 1.21.1 singular data/*/structure path.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []

        roots.each { root ->
            fileTree(root).matching { include 'data/*/structures/multiblocks/*.nbt' }.each { template ->
                hits << "${template}: use singular data/<namespace>/structure/multiblocks, not structures/multiblocks"
            }
        }

        def expectedTemplates = [:].withDefault { [] as Set }
        def cookingSources = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking')
        if (cookingSources.exists()) {
            fileTree(cookingSources).matching { include '**/*.java' }.each { javaFile ->
                (javaFile.getText('UTF-8') =~ /Resource\.mod\("multiblocks\/([^"]+)"\)/).each { match ->
                    expectedTemplates['immersivecooking'] << "multiblocks/${match[1]}"
                }
            }
        }

        def farmingSources = file('src/main/java/dev/emmanueltremblay/immersivefarming')
        if (farmingSources.exists()) {
            fileTree(farmingSources).matching { include '**/*.java' }.each { javaFile ->
                (javaFile.getText('UTF-8') =~ /ImmersiveFarming\.id\("multiblocks\/([^"]+)"\)/).each { match ->
                    expectedTemplates[mod_id] << "multiblocks/${match[1]}"
                }
            }
        }

        expectedTemplates.each { namespace, paths ->
            paths.sort().each { path ->
                def singularPath = "data/${namespace}/structure/${path}.nbt"
                def pluralPath = "data/${namespace}/structures/${path}.nbt"
                if (!roots.any { root -> file("${root}/${singularPath}").exists() }) {
                    hits << "Missing IE multiblock template: ${singularPath}"
                }
                if (roots.any { root -> file("${root}/${pluralPath}").exists() }) {
                    hits << "Wrong-path IE multiblock template still present: ${pluralPath}"
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("IE multiblock template resource issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanDataPackDirectoryNames') {
    group = 'verification'
    description = 'Checks 1.21.1 datapack resources do not use legacy plural directory names.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def legacyMappings = [
                recipes     : 'recipe',
                loot_tables : 'loot_table',
                structures  : 'structure',
                advancements: 'advancement'
        ]
        def hits = []

        roots.each { root ->
            def dataRoot = file("${root}/data")
            if (!dataRoot.exists()) {
                return
            }
            dataRoot.eachDir { namespaceDir ->
                legacyMappings.each { legacyName, replacementName ->
                    def legacyDir = new File(namespaceDir, legacyName)
                    if (legacyDir.exists()) {
                        hits << "${legacyDir}: use data/${namespaceDir.name}/${replacementName}/... for Minecraft 1.21.1"
                    }
                }

                def tagsDir = new File(namespaceDir, 'tags')
                if (tagsDir.exists()) {
                    [
                            blocks      : 'block',
                            items       : 'item',
                            fluids      : 'fluid',
                            entity_types: 'entity_type',
                            game_events : 'game_event'
                    ].each { legacyName, replacementName ->
                        def legacyTagDir = new File(tagsDir, legacyName)
                        if (legacyTagDir.exists()) {
                            hits << "${legacyTagDir}: use data/${namespaceDir.name}/tags/${replacementName}/... for Minecraft 1.21.1"
                        }
                    }
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Legacy datapack directory names found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanCommonTagNamespaces') {
    group = 'verification'
    description = 'Checks migrated 1.21.1 datapack JSONs do not use legacy forge common tags.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []

        roots.each { root ->
            def forgeTagsDir = file("${root}/data/forge/tags")
            if (forgeTagsDir.exists()) {
                hits << "${forgeTagsDir}: use the c namespace for common tags in NeoForge 1.21.1"
            }
            fileTree(root).matching {
                include 'data/**/*.json'
            }.each { json ->
                def text = json.getText('UTF-8')
                if (text.contains('"tag": "forge:')) {
                    hits << "${json}: use c:* common tag references instead of forge:*"
                }
            }
        }

        def icTagsFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/ICTags.java')
        if (icTagsFile.exists()) {
            def text = icTagsFile.getText('UTF-8')
            def fluidSection = text.substring(text.indexOf('public static class Fluids'))
            if (fluidSection.contains('create(forge(')) {
                hits << "${icTagsFile}: fluid common tags must use c:* in NeoForge 1.21.1, not forge:*"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Legacy Forge common tag references found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanOptionalCompatibilityTagEntries') {
    group = 'verification'
    description = 'Checks optional cross-mod tag entries are marked required=false.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def alwaysAvailableNamespaces = [
                'minecraft',
                'immersive_farming_mod_porting',
                'immersivecooking',
                'immersiveengineering',
                'neoforge',
                'c'
        ] as Set
        def slurper = new groovy.json.JsonSlurper()
        def hits = []

        roots.each { root ->
            fileTree(root).matching { include 'data/*/tags/**/*.json' }.each { tagFile ->
                def json = slurper.parse(tagFile)
                if (!(json instanceof Map) || !(json['values'] instanceof List)) {
                    return
                }
                json['values'].eachWithIndex { entry, index ->
                    def id = null
                    def required = true
                    if (entry instanceof String) {
                        id = entry
                    }
                    else if (entry instanceof Map && entry['id'] instanceof String) {
                        id = entry['id']
                        if (entry['required'] instanceof Boolean) {
                            required = entry['required']
                        }
                    }
                    if (!(id instanceof String)) {
                        return
                    }

                    def normalizedId = id.startsWith('#') ? id.substring(1) : id
                    def match = normalizedId =~ /^([a-z0-9_.-]+):[a-z0-9_.\/-]+$/
                    if (!match.matches()) {
                        return
                    }
                    def namespace = match.group(1)
                    if (!alwaysAvailableNamespaces.contains(namespace) && required != false) {
                        hits << "${tagFile}: values[${index}] ${id} references optional namespace ${namespace} but is not required=false"
                    }
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Optional compatibility tag entries are required:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanDependencyVersionRanges') {
    group = 'verification'
    description = 'Checks dependency metadata for required runtime dependencies and dependency-specific version ranges.'
    doLast {
        def metadataFile = file('src/main/resources/META-INF/neoforge.mods.toml')
        def text = metadataFile.getText('UTF-8')
        def hits = []
        def minecraftVersionRangeLiterals = [
                "[${minecraft_version},)",
                "[${minecraft_version},]",
                minecraft_version_range
        ] as Set
        def dependencyBlocks = text.split(/\[\[dependencies\.[^\]]+\]\]/).drop(1)

        dependencyBlocks.each { block ->
            def modIdMatch = block =~ /modId\s*=\s*"([^"]+)"/
            def typeMatch = block =~ /type\s*=\s*"([^"]+)"/
            def versionRangeMatch = block =~ /versionRange\s*=\s*"([^"]+)"/
            if (!modIdMatch.find() || !versionRangeMatch.find()) {
                return
            }

            def dependencyModId = modIdMatch.group(1)
            def dependencyType = typeMatch.find() ? typeMatch.group(1) : ''
            def versionRange = versionRangeMatch.group(1)
            def resolvedVersionRange = versionRange
            def placeholderMatch = versionRange =~ /^\$\{([^}]+)\}$/
            if (placeholderMatch.matches()) {
                def propertyValue = findProperty(placeholderMatch.group(1))
                if (propertyValue != null) {
                    resolvedVersionRange = propertyValue.toString()
                }
            }

            if (dependencyModId == 'farmersdelight' && resolvedVersionRange == "[${minecraft_version},)") {
                hits << "${dependencyModId}: ${versionRange}"
            }
            if (dependencyModId == 'immersiveengineering' && dependencyType != 'required') {
                hits << "${dependencyModId}: dependency type must be required because merged runtime code and resources link IE APIs directly"
            }
            if (dependencyType == 'optional' && minecraftVersionRangeLiterals.contains(resolvedVersionRange)) {
                hits << "${dependencyModId}: optional dependency range ${versionRange} resolves to ${resolvedVersionRange}, which uses the Minecraft version instead of the dependency mod version"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Dependency metadata is inconsistent:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanRecipeCompatibilityConditions') {
    group = 'verification'
    description = 'Checks optional compat recipes are gated by the mods they reference.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def alwaysAvailableNamespaces = [
                'minecraft',
                'immersive_farming_mod_porting',
                'immersivecooking',
                'immersiveengineering',
                'neoforge',
                'forge',
                'c'
        ] as Set
        def slurper = new groovy.json.JsonSlurper()
        def hits = []
        def collectModLoaded
        collectModLoaded = { node ->
            if (node instanceof Map) {
                def found = [] as Set
                if (node.type == 'neoforge:mod_loaded' && node.modid instanceof String) {
                    found << node.modid
                }
                node.values().each { value ->
                    found.addAll(collectModLoaded(value))
                }
                return found
            }
            if (node instanceof List) {
                def found = [] as Set
                node.each { value ->
                    found.addAll(collectModLoaded(value))
                }
                return found
            }
            return [] as Set
        }

        roots.each { root ->
            fileTree(root).matching { include 'data/*/recipe/**/*.json' }.each { recipe ->
                def text = recipe.getText('UTF-8')
                def json = slurper.parse(recipe)
                if (json.containsKey('conditions')) {
                    hits << "${recipe}: use neoforge:conditions, not legacy conditions"
                }
                def conditions = json['neoforge:conditions'] instanceof List ? json['neoforge:conditions'] : []
                def modLoadedConditions = collectModLoaded(conditions)
                def referencedNamespaces = [] as Set
                (text =~ '"([a-z0-9_.-]+):[a-z0-9_./-]+"').each { match ->
                    referencedNamespaces << match[1]
                }
                referencedNamespaces.removeAll(alwaysAvailableNamespaces)

                referencedNamespaces.sort().each { namespace ->
                    if (!modLoadedConditions.contains(namespace)) {
                        hits << "${recipe}: references ${namespace}:* but is not gated by neoforge:mod_loaded ${namespace}"
                    }
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Recipe compatibility condition issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanFarmAndCharmNamespaceReferences') {
    group = 'verification'
    description = 'Checks Farm & Charm compat recipe providers use the runtime mod id namespace.'
    doLast {
        def providerRoot = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/crafting/providers')
        def hits = []

        if (providerRoot.exists()) {
            fileTree(providerRoot).matching { include 'FC*.java' }.each { javaFile ->
                def text = javaFile.getText('UTF-8')
                if (text.contains('"farmcharm"')) {
                    hits << "${javaFile}: use farm_and_charm, not farmcharm"
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Farm & Charm namespace references are inconsistent:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanRecipeSchemaCompatibility') {
    group = 'verification'
    description = 'Checks imported 1.21.1 recipe JSONs use current IE/NeoForge field names.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def slurper = new groovy.json.JsonSlurper()
        def hits = []

        roots.each { root ->
            fileTree(root).matching { include 'data/*/recipe/**/*.json' }.each { recipe ->
                def json = slurper.parse(recipe)
                def recipeType = json.type
                if (!(recipeType instanceof String) || !recipeType.startsWith('immersiveengineering:')) {
                    return
                }

                if (json.result instanceof Map && json.result.item instanceof String) {
                    hits << "${recipe}: IE result item stack uses item; use id"
                }
                if (json.results instanceof List) {
                    json.results.eachWithIndex { result, index ->
                        if (result instanceof Map && result.item instanceof String) {
                            hits << "${recipe}: IE results[${index}] uses item; use id"
                        }
                        if (result instanceof Map && result.output instanceof Map && result.output.item instanceof String) {
                            hits << "${recipe}: IE results[${index}].output uses item; use id"
                        }
                    }
                }
                if (json.secondaries instanceof List) {
                    json.secondaries.eachWithIndex { secondary, index ->
                        if (secondary instanceof Map && secondary.output instanceof Map && secondary.output.item instanceof String) {
                            hits << "${recipe}: IE secondaries[${index}].output uses item; use id"
                        }
                    }
                }
                if (json.fluid instanceof Map && json.fluid.fluid instanceof String) {
                    hits << "${recipe}: IE fluid output uses fluid; use id"
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Recipe schema compatibility issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanRecipesForInvalidOutputs') {
    group = 'verification'
    description = 'Scans recipe JSON files for outputs that point at internal non-item blocks.'
    doLast {
        def internalNonItemIds = ['immersive_farming_mod_porting:composter'] as Set
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []
        def slurper = new groovy.json.JsonSlurper()

        roots.each { root ->
            fileTree(root).matching {
                include 'data/*/recipe/**/*.json'
                include 'data/*/recipes/**/*.json'
            }.each { recipe ->
                def json = slurper.parse(recipe)
                def result = json.result
                def resultIds = []

                if (result instanceof Map) {
                    ['id', 'item'].each { key ->
                        if (result[key] instanceof String) {
                            resultIds << result[key]
                        }
                    }
                }
                else if (result instanceof String) {
                    resultIds << result
                }

                resultIds.findAll { internalNonItemIds.contains(it) }.each { id ->
                    hits << "${recipe}: result ${id}"
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Recipes output internal non-item blocks:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanManualReferences') {
    group = 'verification'
    description = 'Scans Immersive Engineering manual autoload files for missing manual entries and text resources.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def hits = []
        def slurper = new groovy.json.JsonSlurper()

        def manualPaths = { String reference ->
            def parts = reference.split(':', 2)
            def namespace = parts.length == 2 ? parts[0] : mod_id
            def path = parts.length == 2 ? parts[1] : parts[0]
            if (!path.startsWith('manual/')) {
                path = "manual/${path}"
            }
            def manualPath = path.substring('manual/'.length())
            [
                    json: "assets/${namespace}/${path}.json",
                    texts: [
                            en_us: "assets/${namespace}/manual/en_us/${manualPath}.txt",
                            fr_fr: "assets/${namespace}/manual/fr_fr/${manualPath}.txt"
                    ]
            ]
        }

        def findResource = { String relativePath ->
            roots.collect { root -> file("${root}/${relativePath}") }.find { it.exists() }
        }

        def addReference = { references, value ->
            if (value instanceof String) {
                references << value
            }
        }

        roots.each { root ->
            [
                    file("${root}/assets/immersiveengineering/manual/autoload.json"),
                    file("${root}/data/immersiveengineering/manual/autoload.json")
            ].findAll { it.exists() }.each { autoload ->
                def json = slurper.parse(autoload)
                def references = []
                if (json instanceof Map) {
                    json.each { key, value ->
                        if (key != 'autoload_priority' && key != 'category_weight') {
                            addReference(references, value)
                            if (value instanceof Map) {
                                addReference(references, value.source)
                                if (value.entry_list instanceof Collection) {
                                    value.entry_list.each { entry -> addReference(references, entry) }
                                }
                            }
                        }
                    }
                }
                references.unique().each { reference ->
                    def paths = manualPaths(reference)
                    def jsonFile = findResource(paths.json)
                    def textFiles = paths.texts.collectEntries { locale, relativePath ->
                        [(locale): findResource(relativePath)]
                    }
                    if (jsonFile == null) {
                        hits << "${autoload}: ${reference} missing ${paths.json}"
                    }
                    textFiles.each { locale, textFile ->
                        if (textFile == null) {
                            hits << "${autoload}: ${reference} missing ${paths.texts[locale]}"
                        }
                    }
                    if (jsonFile != null && textFiles.values().every { it != null }) {
                        def manualJson = slurper.parse(jsonFile)
                        if (!(manualJson instanceof Map)) {
                            hits << "${jsonFile}: manual JSON must be an object"
                        }
                        else {
                            textFiles.each { locale, textFile ->
                                def text = textFile.getText('UTF-8')
                                (text =~ /<&([^>]+)>/).each { match ->
                                    def elementId = match[1]
                                    if (!manualJson.containsKey(elementId)) {
                                        hits << "${textFile}: ${reference} references <&${elementId}> but ${paths.json} does not define it"
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Manual autoload entries point at invalid or missing manual resources:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanPackagedImportedClasses') {
    group = 'verification'
    description = 'Verifies documented Immersive Cooking classes are packaged intentionally and no dependency jars are bundled.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def entries = []
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            zip.entries().each { entry ->
                if (!entry.directory) {
                    entries << entry.name
                }
            }
        }
        finally {
            zip.close()
        }

        def nestedJars = entries.findAll { it.endsWith('.jar') }
        if (!nestedJars.isEmpty()) {
            throw new GradleException("Unexpected bundled dependency jars in ${jarFile}:\n" + nestedJars.join('\n'))
        }

        def legacyPackageClasses = entries.findAll {
            it.startsWith('uk/akkiserver/immersivecooking/') && it.endsWith('.class')
        }
        if (!legacyPackageClasses.isEmpty()) {
            throw new GradleException("Legacy Immersive Cooking package classes must not be packaged:\n" + legacyPackageClasses.join('\n'))
        }

        def importedClasses = entries.findAll {
            it.startsWith('com/oblixorprime/immersivefarming/immersivecooking/') && it.endsWith('.class')
        }
        if (!importedClasses.isEmpty()) {
            def inventory = file('MERGE_INVENTORY_IMMERSIVE_COOKING.md')
            def documented = inventory.exists()
                    && inventory.getText('UTF-8').contains('Java files under `src/main/java/com/oblixorprime/immersivefarming/immersivecooking`')
                    && inventory.getText('UTF-8').contains('The code is initialized by the target `immersive_farming_mod_porting` mod entrypoint')
            if (!documented) {
                throw new GradleException("Packaged relocated Immersive Cooking classes are not documented as intentional:\n" + importedClasses.join('\n'))
            }
        }
    }
}

tasks.register('validateEngineersManual') {
    group = 'verification'
    description = 'Validates Immersive Engineering manual autoload entries, bilingual text resources, and imported class packaging policy.'
    dependsOn tasks.named('scanManualReferences')
    dependsOn tasks.named('scanPackagedImportedClasses')
}

tasks.register('scanTranslationKeys') {
    group = 'verification'
    description = 'Checks that mod translation keys referenced from Java and sounds.json exist in en_us.json.'
    doLast {
        def langFile = file("src/main/resources/assets/${mod_id}/lang/en_us.json")
        if (!langFile.exists()) {
            throw new GradleException("Missing language file: ${langFile}")
        }

        def slurper = new groovy.json.JsonSlurper()
        def langKeys = (slurper.parse(langFile) as Map).keySet() as Set
        def referencedKeys = [] as Set

        fileTree('src/main/java').matching { include '**/*.java' }.each { javaFile ->
            def text = javaFile.getText('UTF-8')
            (text =~ /(?:Component\.translatable|descriptionId)\("([^"]+)"\)/).each { match ->
                def key = match[1]
                if (key.contains(mod_id)) {
                    referencedKeys << key
                }
            }
        }

        def soundsFile = file("src/main/resources/assets/${mod_id}/sounds.json")
        if (soundsFile.exists()) {
            def sounds = slurper.parse(soundsFile)
            if (sounds instanceof Map) {
                sounds.values().each { entry ->
                    if (entry instanceof Map && entry.subtitle instanceof String && entry.subtitle.contains(mod_id)) {
                        referencedKeys << entry.subtitle
                    }
                }
            }
        }

        def missing = referencedKeys.collect { it.toString() }.findAll { !langKeys.contains(it) }.sort()
        if (!missing.isEmpty()) {
            throw new GradleException("Missing translation keys in ${langFile}:\n" + missing.join('\n'))
        }
    }
}

tasks.register('scanImmersiveEngineeringSoundSubtitles') {
    group = 'verification'
    description = 'Checks local overlays cover known missing Immersive Engineering sound subtitle keys.'
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def localResourceRoots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def langKeys = [] as Set

        localResourceRoots.each { root ->
            def overlayLang = file("${root}/assets/immersiveengineering/lang/en_us.json")
            if (overlayLang.exists()) {
                def overlayJson = slurper.parse(overlayLang)
                if (overlayJson instanceof Map) {
                    langKeys.addAll(overlayJson.keySet())
                }
            }
        }

        def ieJars = configurations.compileClasspath.files.findAll {
            it.name.startsWith('ImmersiveEngineering-') && it.name.endsWith('.jar')
        }
        if (ieJars.isEmpty()) {
            throw new GradleException('Could not find Immersive Engineering on the compile classpath for subtitle verification.')
        }

        def missing = []
        ieJars.each { jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                def langEntry = zip.getEntry('assets/immersiveengineering/lang/en_us.json')
                if (langEntry != null) {
                    def langJson = slurper.parse(zip.getInputStream(langEntry))
                    if (langJson instanceof Map) {
                        langKeys.addAll(langJson.keySet())
                    }
                }

                def soundsEntry = zip.getEntry('assets/immersiveengineering/sounds.json')
                if (soundsEntry != null) {
                    def soundsJson = slurper.parse(zip.getInputStream(soundsEntry))
                    if (soundsJson instanceof Map) {
                        soundsJson.each { soundName, sound ->
                            def ieOwnedSubtitle = sound instanceof Map
                                    && sound.subtitle instanceof String
                                    && (sound.subtitle.startsWith('subtitle.immersiveengineering.')
                                    || sound.subtitle.startsWith('subtitles.immersiveengineering.'))
                            if (ieOwnedSubtitle && !langKeys.contains(sound.subtitle)) {
                                missing << "${jarFile.name}: sound ${soundName} references missing subtitle ${sound.subtitle}"
                            }
                        }
                    }
                }
            }
            finally {
                zip.close()
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException("Immersive Engineering sound subtitles are missing from dependency lang files and local overlays:\n" + missing.join('\n'))
        }
    }
}

tasks.register('scanImmersiveCookingTranslations') {
    group = 'verification'
    description = 'Checks imported Immersive Cooking resources have English translations.'
    doLast {
        def root = file('src/main/resources')
        def langFile = file("${root}/assets/immersivecooking/lang/en_us.json")
        if (!langFile.exists()) {
            throw new GradleException("Missing language file: ${langFile}")
        }

        def slurper = new groovy.json.JsonSlurper()
        def langKeys = (slurper.parse(langFile) as Map).keySet() as Set
        def referencedKeys = [] as Set

        referencedKeys << 'itemGroup.immersivecooking'

        def blockstateRoot = file("${root}/assets/immersivecooking/blockstates")
        if (blockstateRoot.exists()) {
            fileTree(blockstateRoot).matching { include '*.json' }.each { blockstate ->
                def blockName = blockstate.name.replaceFirst(/\.json$/, '')
                if (!blockName.endsWith('_fluid_block')) {
                    referencedKeys << "block.immersivecooking.${blockName}"
                }
            }
        }

        def itemModelRoot = file("${root}/assets/immersivecooking/models/item")
        if (itemModelRoot.exists()) {
            fileTree(itemModelRoot).matching { include '*_bucket.json' }.each { model ->
                def itemName = model.name.replaceFirst(/\.json$/, '')
                referencedKeys << "item.immersivecooking.${itemName}"
            }
        }

        def soundsFile = file("${root}/assets/immersivecooking/sounds.json")
        if (soundsFile.exists()) {
            def sounds = slurper.parse(soundsFile)
            if (sounds instanceof Map) {
                sounds.values().each { entry ->
                    if (entry instanceof Map && entry.subtitle instanceof String) {
                        referencedKeys << entry.subtitle
                    }
                }
            }
        }

        def autoloadFile = file("${root}/assets/immersiveengineering/manual/autoload.json")
        if (autoloadFile.exists()) {
            def autoload = slurper.parse(autoloadFile)
            if (autoload instanceof Map) {
                autoload.each { key, value ->
                    if (key instanceof String && key.startsWith('immersivecooking:')) {
                        def category = key.split(':', 2)[1]
                        referencedKeys << "manual.immersivecooking.${category}"
                    }
                    if (value instanceof Map && value.entry_list instanceof Collection) {
                        value.entry_list.each { entry ->
                            if (entry instanceof String && entry.startsWith('immersivecooking:')) {
                                referencedKeys << "manual.immersivecooking.entry.${entry.split(':', 2)[1]}"
                            }
                        }
                    }
                }
            }
        }

        def missing = referencedKeys.collect { it.toString() }.findAll { !langKeys.contains(it) }.sort()
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Immersive Cooking translation keys in ${langFile}:\n" + missing.join('\n'))
        }
    }
}

tasks.register('scanImmersiveCookingGuiResources') {
    group = 'verification'
    description = 'Checks imported Immersive Cooking GUI textures and menu slot wiring.'
    doLast {
        def resourceRoot = file('src/main/resources')
        def hits = []

        def guiSourceRoot = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/client/gui')
        if (guiSourceRoot.exists()) {
            fileTree(guiSourceRoot).matching { include '**/*Screen.java' }.each { screen ->
                def text = screen.getText('UTF-8')
                (text =~ /Resource\.texture\("([^"]+)"\)/).each { match ->
                    def texturePath = "assets/immersivecooking/textures/${match[1]}"
                    if (!file("${resourceRoot}/${texturePath}").exists()) {
                        hits << "${screen}: Resource.texture(\"${match[1]}\") is missing ${texturePath}"
                    }
                }
            }
        }

        def foodProcessorMenu = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/gui/FoodProcessorMenu.java')
        if (foodProcessorMenu.exists()) {
            def normalized = foodProcessorMenu.getText('UTF-8').replaceAll(/\s+/, ' ')
            if (!normalized.contains('i < FoodProcessorLogic.NUM_INPUT_SLOTS')) {
                hits << "${foodProcessorMenu}: input slot loop must expose FoodProcessorLogic.NUM_INPUT_SLOTS"
            }
            if (!normalized.contains('this.ownSlotCount = FoodProcessorLogic.NUM_SLOTS')) {
                hits << "${foodProcessorMenu}: ownSlotCount must stay tied to FoodProcessorLogic.NUM_SLOTS"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Immersive Cooking GUI resource issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanInternalItemModels') {
    group = 'verification'
    description = 'Scans item models for resources attached to internal blocks without BlockItems.'
    doLast {
