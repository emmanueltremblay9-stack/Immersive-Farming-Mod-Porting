tasks.register('scanSprinklerModelReferences') {
    group = 'verification'
    description = 'Checks that sprinkler models point at the matching normal/high-pressure OBJ assets.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def expectedModels = [
                'models/item/sprinkler.json'              : "${mod_id}:models/block/sprinkler_normal_inv.obj",
                'models/item/sprinkler_extended.json'     : "${mod_id}:models/block/sprinkler_high_inv.obj",
                'models/block/sprinkler_top.json'         : "${mod_id}:models/dynamic/sprinkler_normal_top.obj",
                'models/block/sprinkler_extended_top.json': "${mod_id}:models/dynamic/sprinkler_high_top_static.obj"
        ]
        def hits = []
        def slurper = new groovy.json.JsonSlurper()

        expectedModels.each { modelPath, expectedModel ->
            def found = false
            roots.each { root ->
                def model = file("${root}/assets/${mod_id}/${modelPath}")
                if (model.exists()) {
                    found = true
                    def json = slurper.parse(model)
                    if (json.model != expectedModel) {
                        hits << "${model}: expected model ${expectedModel}, found ${json.model}"
                    }
                }
            }
            if (!found) {
                hits << "No model file found for assets/${mod_id}/${modelPath}"
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Sprinkler model references are inconsistent:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanComposterRecipeCoverage') {
    group = 'verification'
    description = 'Checks that industrial composter data includes both organic-material and compost output recipes.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def slurper = new groovy.json.JsonSlurper()
        def fluidProductRecipes = []
        def compostOutputRecipes = []
        def invalidRecipes = []

        roots.each { root ->
            fileTree(root).matching {
                include 'data/*/recipe/**/*.json'
                include 'data/*/recipes/**/*.json'
            }.each { recipeFile ->
                def json = slurper.parse(recipeFile)
                if (json.type != "${mod_id}:composter") {
                    return
                }
                if (json.fluidProduct == true) {
                    fluidProductRecipes << recipeFile
                    def hasInput = json.input instanceof Map
                    def hasFluidOutput = (json.output0 instanceof Map && json.output0.id instanceof String)
                            || (json.output1 instanceof Map && json.output1.id instanceof String)
                    if (!hasInput || !hasFluidOutput) {
                        invalidRecipes << "${recipeFile}: fluidProduct recipes need input and output0/output1"
                    }
                }
                else {
                    compostOutputRecipes << recipeFile
                    if (!(json.result instanceof Map) || !(json.input0 instanceof Map) || !(json.input1 instanceof Map) || !(json.input2 instanceof Map)) {
                        invalidRecipes << "${recipeFile}: compost recipes need result and input0/input1/input2"
                    }
                }
            }
        }

        if (fluidProductRecipes.isEmpty()) {
            invalidRecipes << 'No item-to-fluid industrial composter recipes were found.'
        }
        if (compostOutputRecipes.isEmpty()) {
            invalidRecipes << 'No fluid-to-compost industrial composter recipes were found.'
        }
        if (!invalidRecipes.isEmpty()) {
            throw new GradleException("Industrial composter recipe coverage is incomplete:\n" + invalidRecipes.join('\n'))
        }
    }
}

tasks.register('scanFoodProcessorRecipeCoverage') {
    group = 'verification'
    description = 'Checks that the merged Immersive Cooking Food Processor ships loadable default recipes.'
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def slurper = new groovy.json.JsonSlurper()
        def expectedRecipePaths = [
                'data/immersivecooking/recipe/food_processor/mushroom_stew.json',
                'data/immersivecooking/recipe/food_processor/pumpkin_pie.json',
                'data/immersivecooking/recipe/food_processor/wheat_dough.json'
        ] as Set
        def expectedFarmersDelightRecipePaths = [
                'data/immersivecooking/recipe/compat/farmersdelight/food_processor/cabbage_leaf.json',
                'data/immersivecooking/recipe/compat/farmersdelight/food_processor/raw_pasta.json',
                'data/immersivecooking/recipe/compat/farmersdelight/food_processor/tomato_sauce.json',
                'data/immersivecooking/recipe/compat/farmersdelight/food_processor/wheat_dough.json'
        ] as Set
        expectedFarmersDelightRecipePaths.addAll([
                'apple_pie_slice',
                'bacon',
                'cake_slice',
                'chicken_cuts',
                'chocolate_pie_slice',
                'cod_slice',
                'cooked_chicken_cuts',
                'cooked_cod_slice',
                'cooked_mutton_chops',
                'cooked_porkchop_from_smoked_ham',
                'cooked_salmon_slice',
                'minced_beef',
                'mutton_chops',
                'porkchop_from_ham',
                'pumpkin_slice',
                'rice',
                'salmon_slice',
                'sweet_berry_cheesecake_slice'
        ].collect { "data/immersivecooking/recipe/compat/farmersdelight/food_processor/cutting/${it}.json" })
        expectedFarmersDelightRecipePaths.addAll([
                'apple_pie',
                'bacon_and_eggs',
                'bacon_sandwich',
                'barbecue_stick',
                'chicken_sandwich',
                'chocolate_pie',
                'cod_roll',
                'egg_sandwich',
                'fruit_salad',
                'grilled_salmon',
                'hamburger',
                'horse_feed',
                'honey_cookie',
                'kelp_roll',
                'melon_juice',
                'melon_popsicle',
                'mixed_salad',
                'mutton_wrap',
                'nether_salad',
                'pie_crust',
                'roasted_mutton_chops',
                'salmon_roll',
                'steak_and_potatoes',
                'stuffed_potato',
                'sweet_berry_cheesecake',
                'sweet_berry_cookie'
        ].collect { "data/immersivecooking/recipe/compat/farmersdelight/food_processor/assembly/${it}.json" })
        def foundRecipePaths = [] as Set
        def foodProcessorRecipes = []
        def invalidRecipes = []

        def expectedPathIsFoodProcessor = { String relativePath ->
            roots.any { root ->
                def recipeFile = new File(root, relativePath)
                recipeFile.exists() && slurper.parse(recipeFile).type == 'immersivecooking:food_processor'
            }
        }

        (expectedRecipePaths + expectedFarmersDelightRecipePaths).each { relativePath ->
            if (!roots.any { root -> file("${root}/${relativePath}").exists() }) {
                invalidRecipes << "Missing default Food Processor recipe: ${relativePath}"
            }
        }

        roots.each { root ->
            def recipeFiles = [] as Set
            recipeFiles.addAll(fileTree(root).matching {
                include 'data/immersivecooking/recipe/**/*.json'
                include 'data/immersivecooking/recipe/compat/farmersdelight/food_processor/cutting/*.json'
                include 'data/immersivecooking/recipe/compat/farmersdelight/food_processor/assembly/*.json'
                include 'data/immersivecooking/recipes/**/*.json'
            }.files)
            (expectedRecipePaths + expectedFarmersDelightRecipePaths).each { relativePath ->
                def expectedFile = new File(root, relativePath)
                if (expectedFile.exists()) {
                    recipeFiles << expectedFile
                }
            }

            def rootPath = root.toPath().toAbsolutePath().normalize()
            recipeFiles.each { recipeFile ->
                def relativePath = rootPath.relativize(recipeFile.toPath().toAbsolutePath().normalize()).toString().replace('\\', '/')
                def json = slurper.parse(recipeFile)
                if (json.type == 'immersivecooking:food_processor') {
                    foodProcessorRecipes << recipeFile
                    foundRecipePaths << relativePath

                    if (relativePath.startsWith('data/immersivecooking/recipes/')) {
                        invalidRecipes << "${recipeFile}: use singular data/immersivecooking/recipe"
                    }
                    if (!(json.inputs instanceof List) || json.inputs.isEmpty()) {
                        invalidRecipes << "${recipeFile}: Food Processor recipes need at least one input"
                    }
                    else if (json.inputs.size() > 8) {
                        invalidRecipes << "${recipeFile}: Food Processor recipes can use at most 8 inputs"
                    }
                    json.inputs.eachWithIndex { input, index ->
                        if (!(input instanceof Map)) {
                            invalidRecipes << "${recipeFile}: Food Processor recipe inputs[${index}] must be an ingredient object"
                        }
                        else {
                            if (input.count != null) {
                                if (!(input.count instanceof Number) || input.count <= 0) {
                                    invalidRecipes << "${recipeFile}: Food Processor recipe inputs[${index}].count must be positive"
                                }
                                if (!(input.basePredicate instanceof Map || input.basePredicate instanceof List)) {
                                    invalidRecipes << "${recipeFile}: counted Food Processor inputs[${index}] must use basePredicate"
                                }
                                if (input.item instanceof String || input.tag instanceof String) {
                                    invalidRecipes << "${recipeFile}: counted Food Processor inputs[${index}] must not use top-level item/tag"
                                }
                            }
                            else if (input.basePredicate != null) {
                                invalidRecipes << "${recipeFile}: Food Processor recipe inputs[${index}].basePredicate requires count"
                            }
                        }
                    }
                    if (!(json.result instanceof Map) || !(json.result.id instanceof String)) {
                        invalidRecipes << "${recipeFile}: Food Processor recipe result must be an item stack object with id"
                    }
                    if (json.result instanceof Map && json.result.item instanceof String) {
                        invalidRecipes << "${recipeFile}: Food Processor recipe result uses item; use id"
                    }
                    if (json.time instanceof Number && json.time <= 0) {
                        invalidRecipes << "${recipeFile}: Food Processor recipe time must be positive"
                    }
                    if (json.energy instanceof Number && json.energy <= 0) {
                        invalidRecipes << "${recipeFile}: Food Processor recipe energy must be positive"
                    }
                    if (expectedFarmersDelightRecipePaths.contains(relativePath)) {
                        def conditions = json['neoforge:conditions'] instanceof List ? json['neoforge:conditions'] : []
                        def gatedByFarmersDelight = conditions.any { condition ->
                            condition instanceof Map && condition.type == 'neoforge:mod_loaded' && condition.modid == 'farmersdelight'
                        }
                        if (!gatedByFarmersDelight) {
                            invalidRecipes << "${recipeFile}: Farmer's Delight Food Processor recipe must be gated by neoforge:mod_loaded farmersdelight"
                        }
                        def jsonText = recipeFile.getText('UTF-8')
                        if (!jsonText.contains('farmersdelight:') && !jsonText.contains('c:crops/tomato') && !jsonText.contains('c:foods/dough')) {
                            invalidRecipes << "${recipeFile}: Farmer's Delight Food Processor recipe does not reference Farmer's Delight content"
                        }
                    }
                }
            }
        }

        def packagedDefaultRecipes = foodProcessorRecipes.findAll { recipeFile ->
            def root = roots.find { candidate -> recipeFile.toPath().startsWith(candidate.toPath()) }
            def relativePath = root == null ? null : root.toPath().relativize(recipeFile.toPath()).toString().replace('\\', '/')
            expectedRecipePaths.contains(relativePath)
        }
        if (packagedDefaultRecipes.isEmpty()) {
            invalidRecipes << 'No packaged default Food Processor recipes were found.'
        }
        if (!foodProcessorRecipes.any { slurper.parse(it).fluid instanceof Map }) {
            invalidRecipes << 'No fluid-assisted Food Processor recipe was found.'
        }
        if (!foodProcessorRecipes.any { !(slurper.parse(it).fluid instanceof Map) }) {
            invalidRecipes << 'No dry Food Processor recipe was found.'
        }
        expectedRecipePaths.findAll { !foundRecipePaths.contains(it) && !expectedPathIsFoodProcessor(it) }.each { relativePath ->
            invalidRecipes << "Default Food Processor recipe is not scanned as immersivecooking:food_processor: ${relativePath}"
        }
        expectedFarmersDelightRecipePaths.findAll { !foundRecipePaths.contains(it) && !expectedPathIsFoodProcessor(it) }.each { relativePath ->
            invalidRecipes << "Farmer's Delight Food Processor recipe is not scanned as immersivecooking:food_processor: ${relativePath}"
        }

        if (!invalidRecipes.isEmpty()) {
            throw new GradleException("Food Processor recipe coverage is incomplete:\n" + invalidRecipes.join('\n'))
        }
    }
}

tasks.register('scanFarmersDelightCompatReferences') {
    group = 'verification'
    description = "Checks Farmer's Delight compat recipes reference items available in the configured dependency jar."
    doLast {
        def roots = [file('src/main/resources'), file('src/generated/resources')].findAll { it.exists() }
        def recipeFiles = [] as Set
        roots.each { root ->
            recipeFiles.addAll(fileTree(root).matching {
                include 'data/immersivecooking/recipe/compat/farmersdelight/**/*.json'
            }.files)
        }
        if (recipeFiles.isEmpty()) {
            return
        }

        def referencedIds = [] as Set
        recipeFiles.each { recipeFile ->
            (recipeFile.getText('UTF-8') =~ /farmersdelight:([a-z0-9_.\/-]+)/).each { match ->
                referencedIds << match[1]
            }
        }
        if (referencedIds.isEmpty()) {
            return
        }

        def farmersDelightJar = configurations.compileClasspath.files.find { candidate ->
            candidate.name.startsWith('farmers-delight-398521-') && candidate.name.endsWith('.jar')
        }
        if (farmersDelightJar == null) {
            throw new GradleException("Could not resolve Farmer's Delight dependency jar for compat reference validation.")
        }

        def availableIds = [] as Set
        def zip = new java.util.zip.ZipFile(farmersDelightJar)
        try {
            zip.entries().each { entry ->
                def itemModelMatch = entry.name =~ /^assets\/farmersdelight\/models\/item\/([^\/]+)\.json$/
                if (itemModelMatch.matches()) {
                    availableIds << itemModelMatch.group(1)
                }
                def blockStateMatch = entry.name =~ /^assets\/farmersdelight\/blockstates\/([^\/]+)\.json$/
                if (blockStateMatch.matches()) {
                    availableIds << blockStateMatch.group(1)
                }
            }

            def langEntry = zip.getEntry('assets/farmersdelight/lang/en_us.json')
            if (langEntry != null) {
                zip.getInputStream(langEntry).withCloseable { stream ->
                    (stream.getText('UTF-8') =~ /"(?:item|block)\.farmersdelight\.([a-z0-9_.\/-]+)"/).each { match ->
                        availableIds << match[1]
                    }
                }
            }
        }
        finally {
            zip.close()
        }

        def missingIds = referencedIds.findAll { id -> !availableIds.contains(id) }.sort()
        if (!missingIds.isEmpty()) {
            throw new GradleException("Farmer's Delight compat recipes reference unavailable items:\n"
                    + missingIds.collect { id -> "farmersdelight:${id}" }.join('\n'))
        }
    }
}

tasks.register('scanImmersiveCookingSoundAssignments') {
    group = 'verification'
    description = 'Checks Immersive Cooking machines use their own registered active sound events and subtitles.'
    doLast {
        def hits = []
        def slurper = new groovy.json.JsonSlurper()
        def contentFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/ICContent.java')
        def processorLogicFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/blocks/multiblocks/logic/FoodProcessorLogic.java')
        def soundsFile = file('src/main/resources/assets/immersivecooking/sounds.json')
        def langFile = file('src/main/resources/assets/immersivecooking/lang/en_us.json')

        def contentText = contentFile.exists() ? contentFile.getText('UTF-8') : ''
        if (!contentText.contains('FOOD_PROCESSOR_ACTIVE = ICRegisters.registerSoundEvent("block.food_processor.active")')) {
            hits << 'ICContent.Sounds must register block.food_processor.active as FOOD_PROCESSOR_ACTIVE'
        }

        def processorText = processorLogicFile.exists() ? processorLogicFile.getText('UTF-8') : ''
        if (!processorText.contains('ICContent.Sounds.FOOD_PROCESSOR_ACTIVE')) {
            hits << 'FoodProcessorLogic must start the processor active sound event'
        }
        if (processorText.contains('ICContent.Sounds.FOOD_FERMENTER_ACTIVE')) {
            hits << 'FoodProcessorLogic must not reuse the Food Fermenter active sound event'
        }

        if (!soundsFile.exists()) {
            hits << "Missing sounds file: ${soundsFile}"
        }
        else {
            def sounds = slurper.parse(soundsFile)
            def processorSound = sounds instanceof Map ? sounds['block.food_processor.active'] : null
            if (!(processorSound instanceof Map)) {
                hits << 'sounds.json must define block.food_processor.active'
            }
            else if (processorSound.subtitle != 'subtitle.immersivecooking.food_processor.active') {
                hits << 'block.food_processor.active must reference subtitle.immersivecooking.food_processor.active'
            }
        }

        if (!langFile.exists()) {
            hits << "Missing language file: ${langFile}"
        }
        else {
            def lang = slurper.parse(langFile) as Map
            if (!lang.containsKey('subtitle.immersivecooking.food_processor.active')) {
                hits << 'en_us.json must define subtitle.immersivecooking.food_processor.active'
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Immersive Cooking sound assignment issues found:\n" + hits.join('\n'))
        }
    }
}

tasks.register('scanImmersiveCookingRedstoneRegistration') {
    group = 'verification'
    description = 'Checks rsState-gated Immersive Cooking multiblocks expose IE redstone controls.'
    doLast {
        def hits = []
        def contentFile = file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/ICContent.java')
        def contentText = contentFile.exists() ? contentFile.getText('UTF-8') : ''
        if (!contentFile.exists()) {
            hits << "Missing content registration file: ${contentFile}"
        }

        [
            [name: 'Cookpot', menu: 'COOKPOT', logic: file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/blocks/multiblocks/logic/CookpotLogic.java')],
            [name: 'Food Fermenter', menu: 'FOOD_FERMENTER', logic: file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/blocks/multiblocks/logic/FoodFermenterLogic.java')],
            [name: 'Food Processor', menu: 'FOOD_PROCESSOR', logic: file('src/main/java/com/oblixorprime/immersivefarming/immersivecooking/common/blocks/multiblocks/logic/FoodProcessorLogic.java')]
        ].each { machine ->
            if (!machine.logic.exists()) {
                hits << "Missing logic file for ${machine.name}: ${machine.logic}"
            }
            else {
                def logicText = machine.logic.getText('UTF-8')
                def usesRedstoneState = logicText.contains('RedstoneControl.RSState') || logicText.contains('state.rsState.isEnabled')
                def expectedRegistration = "builder -> builder.gui(MenuTypes.${machine.menu}).redstone(s -> s.rsState)"
                if (usesRedstoneState && !contentText.contains(expectedRegistration)) {
                    hits << "${machine.name} has rsState-based processing but its multiblock registration does not expose IE redstone control."
                }
            }
        }

        if (!hits.isEmpty()) {
            throw new GradleException("Immersive Cooking redstone registration issues found:\n" + hits.join('\n'))
        }
    }
}

